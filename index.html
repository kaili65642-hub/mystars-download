<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>💙 My Star · 追星周边管理</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
  "Noto Sans SC",sans-serif;
  color:white;
  background:
    radial-gradient(circle at 15% 10%,rgba(54,120,255,.35),transparent 30%),
    radial-gradient(circle at 90% 80%,rgba(95,70,255,.25),transparent 30%),
    linear-gradient(145deg,#09111f,#121b2e 55%,#101827);
}

.container{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:40px 20px 50px;
}

.hero{
  text-align:center;
  padding:25px 10px 30px;
}

.logo{
  width:125px;
  height:125px;
  margin:auto;
  border-radius:35px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:72px;
  background:linear-gradient(145deg,#397cff,#555cff);
  box-shadow:0 20px 50px rgba(50,100,255,.35);
}

h1{
  font-size:42px;
  margin:25px 0 8px;
  letter-spacing:-1px;
}

.subtitle{
  font-size:20px;
  color:#b8c8e8;
  margin-bottom:8px;
}

.description{
  font-size:16px;
  color:#9eacc7;
  line-height:1.7;
}

.card{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.13);
  border-radius:30px;
  padding:28px 22px;
  backdrop-filter:blur(15px);
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.version{
  text-align:center;
  margin-bottom:20px;
}

.android{
  display:inline-block;
  padding:9px 18px;
  border-radius:30px;
  background:rgba(61,135,255,.25);
  color:#9bc6ff;
  margin-right:8px;
}

.download{
  display:block;
  text-align:center;
  text-decoration:none;
  color:white;
  font-size:23px;
  font-weight:700;
  padding:20px;
  border-radius:25px;
  background:linear-gradient(100deg,#3185ff,#6355ff);
  box-shadow:0 15px 35px rgba(67,96,255,.35);
  transition:.2s;
}

.download:active{
  transform:scale(.97);
}

.file-info{
  text-align:center;
  color:#aab8d1;
  margin:18px 0 25px;
}

.features{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.feature{
  padding:22px 15px;
  border-radius:22px;
  background:rgba(255,255,255,.07);
  font-size:17px;
  color:#dbe5f7;
}

.feature-icon{
  font-size:32px;
  display:block;
  margin-bottom:10px;
}

.notice{
  margin-top:20px;
  padding:18px;
  border-radius:20px;
  background:rgba(0,0,0,.18);
  color:#aebbd2;
  line-height:1.7;
  font-size:14px;
}

.footer{
  text-align:center;
  color:#7786a3;
  font-size:13px;
  margin-top:30px;
  line-height:1.8;
}

@media(max-width:430px){
  h1{
    font-size:36px;
  }

  .features{
    gap:10px;
  }

  .feature{
    font-size:15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <section class="hero">
    <div class="logo">💙</div>

    <h1>My Star</h1>

    <div class="subtitle">追星周边管理 App</div>

    <div class="description">
      把你的周边、专辑和库存<br>
      整理得清清楚楚 ✨
    </div>
  </section>

  <section class="card">

    <div class="version">
      <span class="android">📱 Android</span>
      <strong>V6.0.1</strong>
    </div>

    <a class="download"
       href="app-debug.apk"
       download="My-Star-V6.0.1.apk">
      📲 立即下载 My Star
    </a>

    <div class="file-info">
      APK · 约 7.84 MB · 最新版本
    </div>

    <div class="features">

      <div class="feature">
        <span class="feature-icon">📦</span>
        购买记录
      </div>

      <div class="feature">
        <span class="feature-icon">💰</span>
        出物记录
      </div>

      <div class="feature">
        <span class="feature-icon">🗃️</span>
        库存管理
      </div>

      <div class="feature">
        <span class="feature-icon">🖼️</span>
        周边图片
      </div>

      <div class="feature">
        <span class="feature-icon">💳</span>
        付款状态
      </div>

      <div class="feature">
        <span class="feature-icon">📮</span>
        到货状态
      </div>

    </div>

    <div class="notice">
      🔒 <b>资料隐私</b><br>
      每个人的资料独立保存在自己的手机中，
      不会共享给其他使用者。
    </div>

  </section>

  <div class="footer">
    💙 My Star · 追星周边管理<br>
    Android App · V6.0.1
  </div>

</div>

</body>
</html>
